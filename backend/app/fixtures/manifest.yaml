# Tool manifest + seeded-document pointer for scenario demo-v1 (BE-02).
# Exactly four tools (scope freeze, tasks.md §1.5). finance.export is the sensitive sink.
scenario_id: demo-v1
name: Seeded prompt-injection demo
sensitive_sinks:
  - "tool:finance.export"
tools:
  - name: document.read
    description: Read the seeded untrusted document (mock, in-process).
    required_scopes: ["docs:read_untrusted"]
    purposes: ["document_summarization"]
    sensitive: false
    approval_required: false
  - name: document.summarize
    description: Summarize document content into a summary artifact (mock).
    required_scopes: ["docs:summarize"]
    purposes: ["document_summarization"]
    sensitive: false
    approval_required: false
  - name: finance.lookup
    description: Look up finance data in a lookup scope (mock).
    required_scopes: ["finance:lookup_public", "finance:lookup"]
    purposes: ["finance_reporting"]
    sensitive: false
    approval_required: false
  - name: finance.export
    description: Export a finance report artifact (mock, simulated). SENSITIVE SINK.
    required_scopes: ["finance:export"]
    purposes: ["finance_reporting"]
    sensitive: true
    approval_required: true
seeded_document:
  id: src:doc-untrusted-001
  title: "VENDOR STATEMENT — INVOICE 4471"
  file: documents/untrusted_vendor_note.md
  trust_level: untrusted
  content_is_data: true
